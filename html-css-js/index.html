<!DOCTYPE html>
<html>
<head>
    <title>Form Validation Demo</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        input:focus {
            outline: 2px solid black;
        }
        input:invalid {
            border: 1px solid gray;
        }
        p::before {
            content: "• ";
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <h2>Item Entry Form</h2>

    <form id="itemForm" onsubmit="return validateAndSubmit(event)">
        <label>Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Description:</label><br>
        <input type="text" id="description" required><br><br>

        <label>Price:</label><br>
        <input type="text" id="price" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="errorMsg"></p>

    <hr>

    <h3>Submitted Items</h3>
    <table id="itemTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        function validateAndSubmit(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const description = document.getElementById("description").value.trim();
            const price = document.getElementById("price").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            errorMsg.innerText = "";

            if (name.length < 2) {
                errorMsg.innerText = "Name must be at least 2 characters.";
                return false;
            }

            const priceNum = parseFloat(price);
            if (isNaN(priceNum) || priceNum <= 0) {
                errorMsg.innerText = "Price must be a positive number.";
                return false;
            }

            const tbody = document.getElementById("tableBody");
            const row = document.createElement("tr");

            row.innerHTML = "<td>" + name + "</td>" +
                            "<td>" + description + "</td>" +
                            "<td>" + priceNum.toFixed(2) + "</td>" +
                            "<td><button onclick='deleteRow(this)'>Delete</button></td>";

            tbody.appendChild(row);

            document.getElementById("itemForm").reset();
            return true;
        }

        function deleteRow(btn) {
            btn.parentElement.parentElement.remove();
        }
    </script>
</body>
</html>
