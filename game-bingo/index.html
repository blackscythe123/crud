<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-container">
        <h1>BINGO Game</h1>

        <div class="bingo-header">
            <span class="letter" id="letter-0">B</span>
            <span class="letter" id="letter-1">I</span>
            <span class="letter" id="letter-2">N</span>
            <span class="letter" id="letter-3">G</span>
            <span class="letter" id="letter-4">O</span>
        </div>

        <div class="status-bar">
            <span>Completed Lines: <strong id="linesCompleted">0</strong> / 5</span>
            <span id="winBanner" class="win-text"></span>
        </div>

        <button type="button" class="btn-new" onclick="startNewGame()">New Random Board</button>

        <div class="grid" id="bingoGrid"></div>
    </div>
</body>
</html>
