<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack A Mole</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-container">
        <h1>Whack A Mole</h1>

        <div class="stats-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Time Left: <span id="timeLeft">30</span>s</div>
        </div>

        <button type="button" class="btn-start" id="startBtn" onclick="startGame()">Start Game</button>

        <div class="grid">
            <div class="hole" data-index="0"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="1"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="2"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="3"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="4"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="5"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="6"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="7"><div class="mole" onclick="whackMole(this)">🐹</div></div>
            <div class="hole" data-index="8"><div class="mole" onclick="whackMole(this)">🐹</div></div>
        </div>
    </div>
</body>
</html>
